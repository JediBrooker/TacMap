name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'testdata/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'testdata/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build for iPhone Simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}/Contents/Developer"

      - name: Xcode + Simulator runtime info
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      # Secrets.xcconfig is gitignored (holds the Esri key) but xcodegen needs it
      # to exist before it can generate the project. Materialise it from the repo
      # secret; an unset secret writes an empty key (build still compiles, Esri
      # basemap just disabled). Without this, xcodegen fails on a missing config.
      - name: Bootstrap iOS Secrets.xcconfig
        env:
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}
        run: scripts/bootstrap_ios_secrets.sh

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: /tmp/spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve SwiftPM packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project TacticalMaps.xcodeproj \
            -scheme TacticalMaps \
            -clonedSourcePackagesDirPath /tmp/spm-cache

      - name: Build (Debug, iPhone Simulator)
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project TacticalMaps.xcodeproj \
            -scheme TacticalMaps \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath /tmp/spm-cache \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Run unit tests (iPhone Simulator)
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+ Pro \([A-F0-9-]+\)' \
            | tail -1 \
            | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$DEST" ]; then
            DEST=$(xcrun simctl list devices available \
              | grep -oE 'iPhone [0-9]+ \([A-F0-9-]+\)' \
              | tail -1 \
              | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          fi
          echo "Testing on simulator $DEST"
          xcodebuild \
            -project TacticalMaps.xcodeproj \
            -scheme TacticalMaps \
            -destination "id=$DEST" \
            -clonedSourcePackagesDirPath /tmp/spm-cache \
            -derivedDataPath build \
            -skip-testing:TacticalMapsUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee test.log | xcbeautify --renderer github-actions

      - name: Upload .app artefact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TacticalMaps-iOS-debug
          path: ios/build/Build/Products/Debug-iphonesimulator/TacticalMaps.app
          retention-days: 14
