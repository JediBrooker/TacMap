name: iOS Build

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'testdata/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'testdata/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Test and build for iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select latest Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' -print | sort -V | tail -1)
          XCODE=${XCODE:-/Applications/Xcode.app}
          test -d "$XCODE/Contents/Developer"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Xcode + Simulator runtime info
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install pinned XcodeGen
        shell: bash
        env:
          XCODEGEN_VERSION: '2.45.4'
          XCODEGEN_SHA256: '090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_dir="$RUNNER_TEMP/xcodegen"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          mkdir -p "$install_dir"
          ditto -x -k "$archive" "$install_dir"
          echo "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"

      # Secrets.xcconfig is gitignored (holds the Esri key) but xcodegen needs it
      # to exist before it can generate the project. Materialise it from the repo
      # secret; an unset secret writes an empty key (build still compiles, Esri
      # basemap just disabled). Without this, xcodegen fails on a missing config.
      - name: Bootstrap iOS Secrets.xcconfig
        env:
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}
        run: scripts/bootstrap_ios_secrets.sh

      - name: Generate Xcode project
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          xcodegen --version
          xcodegen generate

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve SwiftPM packages
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project TacticalMaps.xcodeproj \
            -scheme TacticalMaps \
            -clonedSourcePackagesDirPath /tmp/spm-cache

      - name: Build (Release, iPhone Simulator)
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project TacticalMaps.xcodeproj \
            -scheme TacticalMaps \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath /tmp/spm-cache \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-log
          path: ios/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Run unit tests (iPhone Simulator)
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          DEST=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+ Pro \([A-F0-9-]+\)' \
            | tail -1 \
            | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$DEST" ]; then
            DEST=$(xcrun simctl list devices available \
              | grep -oE 'iPhone [0-9]+ \([A-F0-9-]+\)' \
              | tail -1 \
              | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          fi
          if [ -z "$DEST" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Testing on simulator $DEST"
          xcodebuild \
            -project TacticalMaps.xcodeproj \
            -scheme TacticalMaps \
            -destination "id=$DEST" \
            -clonedSourcePackagesDirPath /tmp/spm-cache \
            -derivedDataPath build \
            -skip-testing:TacticalMapsUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee test.log | xcbeautify --renderer github-actions

      - name: Upload .app artefact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TacticalMaps-iOS-debug
          path: ios/build/Build/Products/Debug-iphonesimulator/TacticalMaps.app
          retention-days: 14
