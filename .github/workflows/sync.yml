name: Sync Worker

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'sync/**'
      - 'testdata/**'
      - 'docs/security/ADR-001-sync-protocol-v3.md'
      - '.github/workflows/sync.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sync/**'
      - 'testdata/**'
      - 'docs/security/ADR-001-sync-protocol-v3.md'
      - '.github/workflows/sync.yml'
  workflow_dispatch:

jobs:
  check:
    name: Typecheck + bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sync
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Bundle (wrangler dry-run — no deploy, no auth)
        run: |
          set -euo pipefail
          npm run check

      - name: Relay and shared-fixture tests
        run: |
          set -euo pipefail
          npm test
