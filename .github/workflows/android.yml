name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'testdata/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'testdata/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Run unit tests (debug + release)
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest

      - name: Assemble debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          # Built WITHOUT a Maps key on purpose: the uploaded artefact is public
          # (this is a public repo), so we never bake a real key into it — the map
          # just renders blank in the CI APK. Monotonic version code from the run
          # number (offset so it always exceeds the pinned default).
          ./gradlew --no-daemon assembleDebug \
            -PVERSION_CODE="$(( 100000 + GITHUB_RUN_NUMBER ))"

      - name: Assemble release APK (R8 / resource shrink smoke test)
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          # Exercises R8 + resource shrinking so ProGuard-rule regressions
          # (e.g. kotlinx.serialization stripping) fail CI instead of only
          # crashing the shipped Play build. Unsigned + no Maps key is fine — the
          # signing config is conditional on TACTICALMAPS_RELEASE_* being present.
          ./gradlew --no-daemon assembleRelease \
            -PVERSION_CODE="$(( 100000 + GITHUB_RUN_NUMBER ))"

      - name: Upload APK artefact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TacticalMaps-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
