name: Android Build

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'testdata/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'testdata/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Test, lint, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Run unit tests (debug + release)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification strict \
            testDebugUnitTest testReleaseUnitTest

      - name: Lint and compile release sources
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification strict \
            lintRelease compileReleaseKotlin

      - name: Assemble release APK (R8 / resource shrink verification)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # Exercises R8 + resource shrinking so ProGuard-rule regressions
          # (e.g. kotlinx.serialization stripping) fail CI instead of only
          # crashing the shipped Play build. Unsigned + no Maps key is fine — the
          # signing config is conditional on TACTICALMAPS_RELEASE_* being present.
          ./gradlew --no-daemon --dependency-verification strict assembleRelease \
            -PVERSION_CODE="$(( 100000 + GITHUB_RUN_NUMBER ))"

      - name: Run end-to-end PDF import smoke test
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force \
            --name tacmap_ci \
            --package "system-images;android-35;google_apis;x86_64"
          nohup emulator -avd tacmap_ci -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect >/tmp/tacmap-emulator.log 2>&1 &
          adb wait-for-device
          timeout 300 bash -c \
            'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          ./gradlew --no-daemon --dependency-verification strict connectedDebugAndroidTest
