name: Android Build

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'testdata/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'testdata/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Test, lint, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Run unit tests (debug + release)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification strict \
            testDebugUnitTest testReleaseUnitTest

      - name: Lint and compile release sources
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification strict \
            lintRelease compileReleaseKotlin

      - name: Assemble release APK (R8 / resource shrink verification)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # Exercises R8 + resource shrinking so ProGuard-rule regressions
          # (e.g. kotlinx.serialization stripping) fail CI instead of only
          # crashing the shipped Play build. Unsigned with no Maps key is fine; the
          # signing config is conditional on TACTICALMAPS_RELEASE_* being present.
          ./gradlew --no-daemon --dependency-verification strict assembleRelease \
            -PVERSION_CODE="$(( 100000 + GITHUB_RUN_NUMBER ))"

  pdf-import-smoke:
    name: PDF import smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm

      - name: Run end-to-end PDF import smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 300
          working-directory: android
          script: >-
            timeout 600 ./gradlew --no-daemon --dependency-verification strict
            :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.tacmap.map.PdfImportSmokeTest
            --stacktrace
