name: Android Build

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'testdata/**'
      - 'localization/**'
      - 'scripts/*localization*.py'
      - 'scripts/android_release_smoke.sh'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'testdata/**'
      - 'localization/**'
      - 'scripts/*localization*.py'
      - 'scripts/android_release_smoke.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Test, lint, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate English and German localizations
        run: |
          python3 -m unittest discover -s scripts -p 'test_localization*.py'
          python3 scripts/check_localizations.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Run unit tests (debug + release)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification strict \
            testDebugUnitTest testReleaseUnitTest

      - name: Lint and compile release sources
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification strict \
            lintRelease compileReleaseKotlin

      - name: Assemble release APK (R8 / resource shrink verification)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # Exercises R8 + resource shrinking so ProGuard-rule regressions
          # (e.g. kotlinx.serialization stripping) fail CI instead of only
          # crashing the shipped Play build. Unsigned with no Maps key is fine; the
          # signing config is conditional on TACTICALMAPS_RELEASE_* being present.
          ./gradlew --no-daemon --dependency-verification strict assembleRelease \
            -PVERSION_CODE="$(( 100000 + GITHUB_RUN_NUMBER ))"

  pdf-import-smoke:
    name: PDF import, localisation and release launch tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm

      - name: Assemble release APK for the launch smoke test
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # 3.1.0 shipped with R8 output that ART's verifier rejected and every
          # check here was green because we only ever ran debug builds. The
          # minified apk gets debug-signed and cold-started on the emulator
          # below, after the instrumentation tests. Built up front so a plain
          # compile failure fails fast without waiting on an emulator boot.
          ./gradlew --no-daemon --dependency-verification strict :app:assembleRelease

      - name: Run PDF import and localisation instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 300
          working-directory: android
          # The tour test leaves a screenshot of each step on the emulator;
          # pull them whatever the result so the spotlight can be checked by eye.
          # Then reuse the same booted emulator for the release launch smoke:
          # uninstall the debug app, install the debug-signed minified apk,
          # cold start it and fail on a dead process or a VerifyError/FATAL in
          # logcat. Runs even when the instrumentation tests failed so one CI
          # round shows both problems; whichever failed first sets the exit.
          script: >-
            timeout 1200 ./gradlew --no-daemon --dependency-verification strict
            :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.tacmap.map.PdfImportSmokeTest,com.tacmap.localization.LocalizationTest,com.tacmap.waypoints.CustomSymbolPackTest,com.tacmap.map.FirstRunTipsTest,com.tacmap.map.NightModeTest,com.tacmap.map.MBTilesLifecycleInstrumentedTest,com.tacmap.map.MbtilesOpenGuardInstrumentedTest,com.tacmap.map.LegacyMigrationSalvageInstrumentedTest
            --stacktrace; status=$?; adb pull /data/local/tmp/tacmap-tour tour-screenshots || true;
            SMOKE_SKIP_BUILD=1 ../scripts/android_release_smoke.sh app/build/outputs/apk/release/app-release-unsigned.apk; smoke=$?;
            if [ "$status" -ne 0 ]; then exit "$status"; fi; exit "$smoke"

      - name: Upload tour screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-tour-screenshots-api${{ matrix.api }}
          path: android/tour-screenshots
          retention-days: 7
          if-no-files-found: ignore
