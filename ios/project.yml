name: TacticalMaps
include:
  - Localizations.yml
options:
  bundleIdPrefix: com.tacticalmaps
  deploymentTarget:
    iOS: "16.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # Vendored locally with a 4-line Xcode-26 compiler-inference fix in
  # mgrs-ios/utm/UTM.swift (the upstream UTM formulae are single expressions
  # that exceed Swift 6's type-checker budget). See docs/ARCHITECTURE.md.
  mgrs-ios:
    path: Vendor/mgrs-ios

targets:
  TacticalMaps:
    type: application
    platform: iOS
    # Esri API key comes in via a gitignored xcconfig. Both configs point at
    # the same file. scripts/bootstrap_ios_secrets.sh creates it (empty locally,
    # real value from ESRI_API_KEY in CI) before xcodegen runs.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - path: TacticalMaps
        excludes:
          - "**/.DS_Store"
    # No bundled sample resources — the app ships empty. Users import
    # their own GeoPDFs via the Files picker. The repo's `samples/`
    # directory is dev-only (handy for testing the import path).
    info:
      path: TacticalMaps/Resources/Info.plist
      properties:
        CFBundleDisplayName: TacMap
        CFBundleShortVersionString: "2.0.2"
        CFBundleVersion: "68"
        # Esri Location Platform key + expiry. The $(ESRI_API_KEY) reference is
        # substituted from Secrets.xcconfig during Xcode's plist processing at
        # build time (xcodegen writes it here verbatim). Not a secret - it ships
        # in the bundle and is a quota control. Empty disables the Esri basemap.
        # NOTE: this block regenerates Info.plist, so edit keys HERE, not there.
        ESRIApiKey: $(ESRI_API_KEY)
        ESRIKeyExpiry: "2027-06-30"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # iOS 16+ devices are all arm64. armv7 is 32-bit and would
        # silently bar every modern device (Apple flags it on review).
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking (Split View) requires all 4 orientations
        # including UpsideDown. iPhone keeps the 3-orientation set.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Face ID unlocks TacMap's locally encrypted mission data and optional app lock."
        NSLocationWhenInUseUsageDescription: TacMap shows your live position and MGRS grid, records user-started GPX tracks in the background, and shares your encrypted position with joined Sync peers while the screen is off only when you enable Share my location and Background Unit Sync in OPSEC.
        # Background location supports an explicitly started GPX recording and
        # separately opted-in screen-off Unit Sync presence. Both are visible,
        # persistent-location features. We stay on When-In-Use authorization,
        # show the system indicator, and use independent runtime leases so no
        # background access remains after both features stop.
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
        # File sharing is deliberately OFF. Exposing the app's Documents folder
        # in Files/Finder would put imported operational maps (your AO) one tap
        # from anyone with the unlocked device or a paired host - the opposite
        # of dark-by-default. Imports come in through the in-app Import picker
        # and are copied into app-private, file-protected storage instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tacticalmaps.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: TacticalMaps/Resources/Info.plist
        # Apple Developer team. Debug uses Xcode-managed development signing;
        # Release archives use the App Store Connect distribution profile.
        DEVELOPMENT_TEAM: 6MY34D5RKG
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: TacticalMaps
    preBuildScripts:
      - name: Require secure simulator signing
        basedOnDependencyAnalysis: false
        script: |
          if [[ "$PLATFORM_NAME" == *simulator* && "$CODE_SIGNING_ALLOWED" != "YES" ]]; then
            echo "error: TacMap simulator builds must be normally signed; CODE_SIGNING_ALLOWED=NO breaks Keychain-backed entitlement, app-lock, and sync identity storage." >&2
            echo "error: Use scripts/install_simulator.sh to build and install on the pinned existing simulator." >&2
            exit 1
          fi
    dependencies:
      - package: mgrs-ios
        product: MGRS
    scheme:
      storeKitConfiguration: TacticalMaps.storekit
      testTargets:
        - TacticalMapsTests
        - TacticalMapsUITests
      gatherCoverageData: true

  TacticalMapsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TacticalMapsTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: TacticalMaps
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.tacticalmaps.app.tests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"

  # UI-test target for release smoke coverage and App Store screenshots.
  # Run selected tests with -only-testing:TacticalMapsUITests.
  TacticalMapsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TacticalMapsUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: TacticalMaps
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.tacticalmaps.app.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        TEST_TARGET_NAME: TacticalMaps
